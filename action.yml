# Composite GitHub Action for Rampart.
# Usage in a consumer workflow:
#
#   - uses: NitinReddy-A/Rampart@v1              # floating 1.x tag; pin @v1.1.0 to be exact
#     with:
#       target: https://staging.example.com      # authorized target (required)
#       scope-file: rampart.scope.yaml           # authorization contract
#       fail-on: high                            # gate severity
#       comment-pr: true                         # sticky PR summary (needs pull-requests: write)
#   - uses: actions/upload-artifact@v4
#     if: always()
#     with:
#       name: rampart-report
#       path: .rampart/reports/
#
# Only scan assets you own or are explicitly authorized to test. Rampart
# refuses to run without a valid, unexpired, in-scope rampart.scope.yaml contract.
name: "Rampart AppSec Scan"
description: "Authorized, evidence-first web/API/LLM security scan that emits SARIF for GitHub code scanning."
author: "Rampart contributors"

branding:
  icon: "shield"
  color: "blue"

inputs:
  scope-file:
    description: "Path to the rampart.scope.yaml authorization contract."
    required: false
    default: "rampart.scope.yaml"
  target:
    description: "Authorized target base URL, e.g. https://staging.example.com."
    required: true
  report:
    description: "Comma list of report formats to generate (html,md,json,sarif,compliance)."
    required: false
    default: "sarif"
  fail-on:
    description: "CI gate severity: low|medium|high|critical. The action exits nonzero on a validated finding at or above this."
    required: false
    default: "high"
  scanners:
    description: "Optional external OSS adapters to also run (e.g. nuclei,semgrep or 'all'). Empty uses only the built-in oracles."
    required: false
    default: ""
  work-dir:
    description: "Run directory for the audit log, evidence, and reports."
    required: false
    default: ".rampart"
  comment-pr:
    description: "On a pull_request event, post a sticky findings summary as a PR comment. Requires the workflow to grant `pull-requests: write`."
    required: false
    default: "false"

outputs:
  sarif-path:
    description: "Path to the generated SARIF report."
    value: ${{ steps.sarif.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Rampart
      shell: bash
      # Install the package that ships with this action (github.action_path is
      # the action's checked-out directory). This keeps the action and the engine
      # at exactly the same version.
      run: |
        python -m pip install --upgrade pip
        pip install -e "${{ github.action_path }}"

    - name: Run Rampart assessment
      id: rampart
      shell: bash
      run: |
        python -m rampart test \
          --scope-file "${{ inputs.scope-file }}" \
          --target "${{ inputs.target }}" \
          --work-dir "${{ inputs.work-dir }}" \
          --report "${{ inputs.report }},json" \
          ${{ inputs.scanners != '' && format('--scanners {0}', inputs.scanners) || '' }} \
          --ci \
          --fail-on "${{ inputs.fail-on }}"
      # Expose the SARIF path (<work-dir>/reports/report.sarif) for a follow-up
      # github/codeql-action/upload-sarif step. Always set it, even on gate failure.

    - name: Expose SARIF path
      id: sarif
      if: always()
      shell: bash
      run: echo "sarif-path=${{ inputs.work-dir }}/reports/report.sarif" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: always() && inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python -m rampart pr-comment \
          --work-dir "${{ inputs.work-dir }}" \
          --fail-on "${{ inputs.fail-on }}" || true
