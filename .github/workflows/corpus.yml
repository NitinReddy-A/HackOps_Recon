# External-corpus scoring — runs Rampart against OWASP VAmPI (Dockerised) and scores precision/recall.
# VAmPI has a vulnerable/secure switch (like Rampart's own demo), so it is ideal for CI scoring.
# Manual/scheduled (not on every push) since it pulls an image and runs a live assessment.

name: Corpus (VAmPI)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly

permissions:
  contents: read

jobs:
  vampi:
    runs-on: ubuntu-latest
    services:
      vampi:
        image: erev0s/vampi:latest
        ports:
          - 5000:5000
        env:
          vulnerable: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Wait for VAmPI
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/ && break || sleep 2; done
      - name: Score Rampart against VAmPI
        run: |
          python benchmarks/corpus_runner.py \
            --target http://127.0.0.1:5000 \
            --scope-file benchmarks/fixtures/vampi-rampart.scope.yaml \
            --ground-truth benchmarks/fixtures/vampi-ground-truth.json \
            --crawl --active --min-recall 0.5
      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vampi-corpus
          path: .rampart-corpus/
