name: CI

# Build + test Rampart on every push and PR.
# Rampart's core is dependency-free stdlib Python, so CI stays fast and simple.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extra, falling back to pytest)
        run: |
          python -m pip install --upgrade pip
          # The [dev] extra provides pytest; fall back if it isn't configured yet.
          pip install -e ".[dev]" || { pip install -e . && pip install pytest; }

      - name: Run tests
        run: python -m pytest -q

      - name: Run reliability benchmark
        # Exits nonzero on any false positive / false negative, gating the build.
        run: python benchmarks/run_benchmark.py
