name: CI

# Build + test Rampart on every push and PR.
# Rampart's core is dependency-free stdlib Python, so CI stays fast and simple.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.16.10"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extra, falling back to pytest)
        run: |
          python -m pip install --upgrade pip
          # The [dev] extra provides pytest; fall back if it isn't configured yet.
          pip install -e ".[dev]" || { pip install -e . && pip install pytest; }

      - name: Run tests
        run: python -m pytest -q

      - name: Run reliability benchmark
        # Exits nonzero on any false positive / false negative, gating the build.
        run: python benchmarks/run_benchmark.py

  docker:
    # Build the release image on every push so a broken Dockerfile is caught here, not at release time.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: rampart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: |
          docker run --rm rampart:ci --version
          docker run --rm -v "$PWD/examples:/work/examples:ro" rampart:ci \
            init --scope-file examples/demo_target/rampart.scope.yaml
