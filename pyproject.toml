[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rampart-appsec"
dynamic = ["version"]
description = "Open-source, self-hostable, evidence-first application-security agent — find, prove, and help fix web/API vulnerabilities in apps you are authorized to test."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Nitin", email = "nitin.code2@gmail.com" },
  { name = "Rampart contributors" },
]
maintainers = [{ name = "Nitin", email = "nitin.code2@gmail.com" }]
keywords = [
  "security", "appsec", "pentest", "vapt", "dast", "sast", "sca",
  "bola", "idor", "sarif", "soc2", "authorized-testing", "agent", "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

# The CORE has NO required runtime dependencies (stdlib only) so it runs anywhere.
dependencies = []

[project.optional-dependencies]
# Nicer scope parsing (a strict fallback parser is built in, so this is optional).
yaml = ["PyYAML>=6.0"]
# Bring-your-own-key LLM path uses stdlib urllib; no extra deps required.
# Headless-browser engine for stored/DOM XSS (optional). After install:
#   python -m playwright install chromium
browser = ["playwright>=1.40"]
# gRPC endpoint scanning (server-reflection exposure). Without it, the gRPC scan is a no-op.
grpc = ["grpcio>=1.60", "grpcio-reflection>=1.60"]
# Full SCA matches dependencies against OSV.dev over the network using only stdlib urllib —
# no extra install required; enable it with `--sca-online`.
# Test/dev tooling (lint + format via ruff, tests via pytest).
dev = ["pytest>=7.0", "ruff==0.16.10", "pre-commit>=3.5"]
# Everything, for a one-shot contributor install: `pip install -e ".[all]"`.
all = ["PyYAML>=6.0", "playwright>=1.40", "grpcio>=1.60", "grpcio-reflection>=1.60"]

[project.scripts]
rampart = "rampart.cli:main"

[project.urls]
Homepage = "https://github.com/NitinReddy-A/Rampart"
Documentation = "https://github.com/NitinReddy-A/Rampart#readme"
Repository = "https://github.com/NitinReddy-A/Rampart"
Issues = "https://github.com/NitinReddy-A/Rampart/issues"
Changelog = "https://github.com/NitinReddy-A/Rampart/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "rampart.version.__version__" }

[tool.setuptools.packages.find]
include = ["rampart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# --- Ruff: linter + formatter (replaces flake8/black/isort). Run `ruff check` and `ruff format`. ---
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["examples/demo_target/src", "research_notes", "reports"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pyflakes + pycodestyle
  "I",             # isort (import ordering)
  "UP",            # pyupgrade
  "B",             # flake8-bugbear
  "C4",            # flake8-comprehensions
  "SIM",           # flake8-simplify
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # function call in default arg (used intentionally for injectable seams)
  "SIM105",  # contextlib.suppress — explicit try/except reads clearer in the safety paths
  "SIM108",  # if/else -> ternary: often less readable for multi-line math/branches
  "SIM115",  # terse one-line reads of small config/manifest files are intentional
  "E731",    # small inline lambdas (approvers, seams) are intentional and local
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "E702"]
"examples/**" = ["B", "SIM", "UP"]
"scripts/**" = ["B", "SIM"]
"rampart/browser/engine.py" = ["UP031"]   # a JS init-script template uses printf-style %s on purpose

[tool.ruff.lint.isort]
known-first-party = ["rampart"]
